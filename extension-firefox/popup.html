<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>MediaHub</title></head><body>
<h1>Добавить вкладки в MediaHub</h1>
<form id="f"><div id="opts" role="radiogroup" aria-label="Что передать"></div>
<label class="chk"><input type="checkbox" id="close" checked> Закрыть вкладки после успешной обработки</label>
<button type="submit" id="go" class="go">Показать список в приложении</button></form>
<p id="msg" class="msg" role="status"></p>
<p class="note">Расширение видит только адрес и название вкладок, которые вы отправляете. Пароли, cookies, история и закладки не читаются. Ничего не скачивается, пока вы не подтвердите список в приложении. Для манги расширение на время загрузки открывает небольшое окно сайта.</p>
<script src="popup.js"></script></body></html>

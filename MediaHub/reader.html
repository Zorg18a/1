<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Читалка</title>
<style>:root{--ink:#0d0f14;--panel:#12151d;--raise:#1a1e2a;--line:rgba(170,185,230,.16);--text:#e9ebf3;--mute:#8f96ab;--amber:#f2b84b;color-scheme:dark}
body{margin:0;background:var(--ink);color:var(--text);font:15px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 18px;background:rgba(18,21,29,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header b{font-weight:650;letter-spacing:-.01em;margin-right:auto}
a,button,select{color:var(--text);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;text-decoration:none;cursor:pointer}
a:hover,button:hover{border-color:rgba(170,185,230,.34)}a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#v{max-width:900px;margin:0 auto}#v img{display:block;width:100%;min-height:200px}.mu{color:var(--mute);padding:14px 16px}#v button{background:var(--amber);border-color:var(--amber);color:#1c1406;font-weight:650}</style></head><body>
<header><a href="/">← Библиотека</a><b id="t"></b><select id="c"></select><button id="p">◀ Пред.</button><button id="n">След. ▶</button><span id="s" class="mu"></span></header><div id="v"></div>
<script>
const id=location.pathname.split('/')[2],$=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let M,cur=0,tm;
async function load(){M=await(await fetch('/api/manga/'+id)).json();if(M.error){$('v').textContent='Тайтл не найден';return}
document.title=M.title;$('t').textContent=M.title+` · скачано глав ${M.have} из ${M.total||M.have}`;
$('c').innerHTML=M.chapters.map((c,i)=>`<option value="${i}">${c.files.length?(c.done?'✓ ':'◐ '):'○ '}${esc(c.label)}</option>`).join('');
let i=M.chapters.findIndex(c=>c.files.length),pg=0;if(M.progress){const k=M.chapters.findIndex(c=>c.id==M.progress.cid);if(k>=0){i=k;pg=M.progress.page}}open_(Math.max(0,i),pg)}
async function open_(i,pg=0){if(!M.chapters[i])return;cur=i;$('c').value=i;const c=M.chapters[i];
if(!c.files.length){$('v').innerHTML=`<p class="mu">Глава «${esc(c.label)}» ещё не скачана. Запустите загрузку тайтла ещё раз: готовые главы пропускаются, докачаются недостающие.</p><p style="text-align:center"><button onclick="open_(cur+1)">Следующая глава ▶</button></p>`;return}
$('v').innerHTML=c.files.map((f,k)=>`<img data-i="${k}" ${k>pg+1?'loading="lazy"':''} src="/mi/${id}/${c.id}/${f}" alt="Страница ${k+1}">`).join('')+`<p class="mu">${c.done?'Конец главы':`Скачано ${c.files.length} из ${c.expected} стр.`}</p><p style="text-align:center"><button onclick="open_(cur+1)">Следующая глава ▶</button></p>`;
await Promise.all([...$('v').querySelectorAll('img')].slice(0,pg+1).map(x=>x.decode().catch(()=>0)));
const t=$('v').children[pg];t?t.scrollIntoView():scrollTo(0,0)}
function save(){const im=[...$('v').querySelectorAll('img')];let k=im.findIndex(x=>x.getBoundingClientRect().bottom>70);if(k<0)k=0;$('s').textContent=`стр. ${k+1}/${im.length}`;
if(M.chapters[cur].files.length)fetch('/api/progress',{method:'POST',headers:{'X-MH':'1'},body:JSON.stringify({id:+id,cid:M.chapters[cur].id,page:k})})}
addEventListener('scroll',()=>{clearTimeout(tm);tm=setTimeout(save,700)});
$('c').onchange=e=>open_(+e.target.value);$('p').onclick=()=>open_(cur-1);$('n').onclick=()=>open_(cur+1);load();
</script></body></html>
